name: PhoneLending Batch 1 Build

on:
  push:
    branches:
      - batch1-v0.3.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APKs and release-boundary check APK
        run: gradle --no-daemon :host:assembleDebug :consumer:assembleDebug :consumer:assembleRelease

      - name: Verify debug recovery compile-time boundary
        run: |
          set -euo pipefail
          DEBUG_APK="$(find apps/consumer/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RELEASE_APK="$(find apps/consumer/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          rm -rf /tmp/debug-dex /tmp/release-dex
          mkdir -p /tmp/debug-dex /tmp/release-dex
          unzip -q "$DEBUG_APK" 'classes*.dex' -d /tmp/debug-dex
          unzip -q "$RELEASE_APK" 'classes*.dex' -d /tmp/release-dex
          if ! grep -a -q 'DebugRecoveryHooks' /tmp/debug-dex/classes*.dex; then
            echo 'ERROR: debug recovery hook missing from development Consumer APK'
            exit 1
          fi
          if grep -a -q 'DebugRecoveryHooks' /tmp/release-dex/classes*.dex; then
            echo 'ERROR: development recovery hook leaked into release Consumer APK'
            exit 1
          fi
          echo 'PASS: debug recovery exists only in debug Consumer source/output.'

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          CONSUMER_APK="$(find apps/consumer/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$HOST_APK"
          test -n "$CONSUMER_APK"
          cp "$HOST_APK" dist/PhoneLending-Host-v0.3.0-vc1-dev.apk
          cp "$CONSUMER_APK" dist/PhoneLending-Consumer-v0.3.0-vc1-dev.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-batch1-apks
          path: dist/
          if-no-files-found: error
