name: PhoneLending Batch 1 Build

on:
  push:
    branches:
      - batch1-v0.3.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APKs
        run: gradle --no-daemon :host:assembleDebug :consumer:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp apps/host/app/build/outputs/apk/debug/app-debug.apk dist/PhoneLending-Host-v0.3.0-vc1-dev.apk
          cp apps/consumer/app/build/outputs/apk/debug/app-debug.apk dist/PhoneLending-Consumer-v0.3.0-vc1-dev.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-batch1-apks
          path: dist/
          if-no-files-found: error
