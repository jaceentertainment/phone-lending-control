name: PhoneLending v0.4 QR Pairing Build

on:
  push:
    branches:
      - batch2-v0.4.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Host, Consumer debug, and Consumer release-boundary APK
        run: gradle --no-daemon :host:assembleDebug :consumer:assembleDebug :consumer:assembleRelease

      - name: Verify development recovery compile-time boundary
        run: |
          set -euo pipefail
          DEBUG_APK="$(find apps/consumer/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RELEASE_APK="$(find apps/consumer/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$DEBUG_APK"
          test -n "$RELEASE_APK"
          rm -rf /tmp/debug-dex /tmp/release-dex
          mkdir -p /tmp/debug-dex /tmp/release-dex
          unzip -q "$DEBUG_APK" 'classes*.dex' -d /tmp/debug-dex
          unzip -q "$RELEASE_APK" 'classes*.dex' -d /tmp/release-dex
          CLASS_DESCRIPTOR='Lcom/jace/phonelending/consumer/DebugRecoveryHooks;'
          if ! grep -a -q "$CLASS_DESCRIPTOR" /tmp/debug-dex/classes*.dex; then
            echo 'ERROR: debug recovery implementation missing from development Consumer APK'
            exit 1
          fi
          if grep -a -q "$CLASS_DESCRIPTOR" /tmp/release-dex/classes*.dex; then
            echo 'ERROR: development recovery implementation leaked into release Consumer APK'
            exit 1
          fi
          echo 'PASS: development recovery implementation exists only in debug Consumer output.'

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          CONSUMER_APK="$(find apps/consumer/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$HOST_APK"
          test -n "$CONSUMER_APK"
          cp "$HOST_APK" dist/PhoneLending-Host-v0.4.0-vc2-dev.apk
          cp "$CONSUMER_APK" dist/PhoneLending-Consumer-v0.4.0-vc2-dev.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Package exact source snapshot
        run: |
          set -euo pipefail
          mkdir -p source-dist/PhoneLending-Control-v0.4.0-source
          rsync -a \
            --exclude '.git/' \
            --exclude '**/build/' \
            --exclude '.gradle/' \
            --exclude 'dist/' \
            --exclude 'source-dist/' \
            ./ source-dist/PhoneLending-Control-v0.4.0-source/
          printf '%s\n' '${{ github.sha }}' > source-dist/PhoneLending-Control-v0.4.0-source/SOURCE_COMMIT.txt
          find source-dist/PhoneLending-Control-v0.4.0-source -type f -print0 | sort -z | xargs -0 sha256sum > source-dist/SOURCE_SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.4.0-apks
          path: dist/
          if-no-files-found: error

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.4.0-source
          path: source-dist/
          if-no-files-found: error
