name: PhoneLending v0.5.0 Light Lock Development Build

on:
  push:
    branches:
      - batch2-v0.5.0-light-lock
  workflow_dispatch:

jobs:
  compile_and_boundary_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Host and Rental field build
        run: gradle --no-daemon :host:assembleDebug :consumer:assembleFieldTest
      - name: Verify early-development light-lock boundary
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          RENTAL_APK="$(find apps/consumer/app/build/outputs/apk/fieldTest -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          PACKAGE="$($AAPT2 dump packagename "$RENTAL_APK")"
          test "$PACKAGE" = 'com.jace.phonelending.consumer.field' || { echo "ERROR: Rental package identity mismatch: $PACKAGE"; exit 1; }
          MANIFEST="$($AAPT2 dump xmltree "$RENTAL_APK" --file AndroidManifest.xml)"
          echo "$MANIFEST" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW' || { echo 'ERROR: light-lock overlay permission missing'; exit 1; }
          if echo "$MANIFEST" | grep -q 'android.app.action.DEVICE_ADMIN_ENABLED'; then echo 'ERROR: Device Admin leaked into light-lock field build'; exit 1; fi
          if echo "$MANIFEST" | grep -q 'android.app.action.GET_PROVISIONING_MODE'; then echo 'ERROR: Device Owner provisioning leaked into light-lock field build'; exit 1; fi
          if echo "$MANIFEST" | grep -q 'android.intent.category.HOME'; then echo 'ERROR: persistent HOME leaked into light-lock field build'; exit 1; fi
          echo "$MANIFEST" | grep -q 'android:testOnly' || { echo 'ERROR: testOnly attribute missing'; exit 1; }
          if echo "$MANIFEST" | grep 'android:testOnly' | grep -qE '0xffffffff|true'; then echo 'ERROR: Rental field APK is testOnly=true'; exit 1; fi
          rm -rf /tmp/pl-field && mkdir -p /tmp/pl-field
          unzip -q "$RENTAL_APK" 'classes*.dex' -d /tmp/pl-field
          grep -a -q 'Lcom/jace/phonelending/consumer/SoftLockOverlay;' /tmp/pl-field/classes*.dex || { echo 'ERROR: SoftLockOverlay missing'; exit 1; }
          if grep -a -q 'Lcom/jace/phonelending/consumer/DebugRecoveryHooks;' /tmp/pl-field/classes*.dex; then echo 'ERROR: old PIN recovery hook leaked into field Rental artifact'; exit 1; fi
          echo 'PASS: v0.5.0 field Rental is normal-install, soft-lock only, and has no Device Owner/HOME/PIN recovery boundary.'
      - name: Verify compile APKs are unsigned
        run: |
          set -euo pipefail
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RENTAL_APK="$(find apps/consumer/app/build/outputs/apk/fieldTest -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          for apk in "$HOST_APK" "$RENTAL_APK"; do if apksigner verify "$apk" >/dev/null 2>&1; then echo "ERROR: compile-only APK unexpectedly signed: $apk"; exit 1; fi; done
      - name: Collect unsigned artifacts and signer
        run: |
          set -euo pipefail
          mkdir -p unsigned-dist signing-tool
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RENTAL_APK="$(find apps/consumer/app/build/outputs/apk/fieldTest -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          cp "$HOST_APK" unsigned-dist/PhoneLending-Host-v0.5.0-vc4-UNSIGNED.apk
          cp "$RENTAL_APK" unsigned-dist/PhoneLending-Rental-v0.5.0-vc6-field-UNSIGNED.apk
          printf '%s\n' 'UNSIGNED COMPILE ARTIFACTS — NOT DISTRIBUTABLE. v0.5.0 is early-development light-lock software, not production security.' > unsigned-dist/NON_DISTRIBUTABLE.txt
          sha256sum unsigned-dist/*.apk > unsigned-dist/SHA256SUMS.txt
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tool/apksigner-36.0.0.jar
      - name: Upload unsigned compile artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.5.0-UNSIGNED-NON-DISTRIBUTABLE
          path: unsigned-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android signer
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-36.0.0
          path: signing-tool/
          if-no-files-found: error
          retention-days: 14
      - name: Package exact source snapshot
        run: |
          set -euo pipefail
          mkdir -p source-dist/PhoneLending-Control-v0.5.0-source
          rsync -a --exclude '.git/' --exclude '**/build/' --exclude '.gradle/' --exclude 'source-dist/' --exclude 'unsigned-dist/' --exclude 'signing-tool/' ./ source-dist/PhoneLending-Control-v0.5.0-source/
          printf '%s\n' '${{ github.sha }}' > source-dist/PhoneLending-Control-v0.5.0-source/SOURCE_COMMIT.txt
          find source-dist/PhoneLending-Control-v0.5.0-source -type f -print0 | sort -z | xargs -0 sha256sum > source-dist/SOURCE_SHA256SUMS.txt
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.5.0-source
          path: source-dist/
          if-no-files-found: error
