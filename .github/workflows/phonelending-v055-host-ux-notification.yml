name: PhoneLending v0.5.5 Host UX + Notification Build

on:
  push:
    branches:
      - batch5-v0.5.5-host-ux-notification
  workflow_dispatch:

jobs:
  compile_and_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct patches
        run: |
          set -euo pipefail
          cat tools/v0.5.2-professional-ui.patch.gz.b64.part-* > /tmp/v052.patch.gz.b64
          echo '025bee9ee89255810ff313b25c6f7e64649727b73336e757b3023a03f18989ae  /tmp/v052.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v052.patch.gz.b64 | gzip -d > /tmp/v052.patch
          echo 'baa3b11b1af7e00f43540b0c1975f90e9a6f6f320984da72ec7a5022dbf5573c  /tmp/v052.patch' | sha256sum -c -
          echo '8f146648fed89d24e91d76f5ac439bd927617033e87e632a9cc167083698c306  tools/v0.5.3-timer-qualification.patch.gz.b64' | sha256sum -c -
          base64 -d tools/v0.5.3-timer-qualification.patch.gz.b64 | gzip -d > /tmp/v053.patch
          echo '12c998cf9440377b8b1b5bd01d187b04b5e7f1a87bf660791e29de2caed5276f  /tmp/v053.patch' | sha256sum -c -

          echo '2d6c4817f3362c7c55bedc29a556c55237aa22a789c6f0530f9b2f36d0cae6e4  tools/v0.5.4-phase1-android.patch.gz.b64.part-00' | sha256sum -c -
          echo 'b0cac93952b9ce70abd923c086aefed8085bdfed59791220b59b0850d44cd248  tools/v0.5.4-phase1-android.patch.gz.b64.part-01' | sha256sum -c -
          echo '718a6cc46992523f22c227bbf2033f72b76947900cbc381d9d9f2238c0e29c5d  tools/v0.5.4-phase1-android.patch.gz.b64.part-02' | sha256sum -c -
          echo 'd4ce363b2e518d333c5dbe3212894f3a442ad97b28b72d0987b6805971d6a42f  tools/v0.5.4-phase1-android.patch.gz.b64.part-03' | sha256sum -c -
          cat tools/v0.5.4-phase1-android.patch.gz.b64.part-* > /tmp/v054.patch.gz.b64
          echo '410835611498f381cd00651a52d233ef6e2c3bce72955a07496618b9293dee10  /tmp/v054.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v054.patch.gz.b64 | gzip -d > /tmp/v054.patch
          echo '81f25cd8db4ee81075aa492ec88db6835170c67f3066fff1ad81e0e57a6c859d  /tmp/v054.patch' | sha256sum -c -

          echo '265d75eb3fdc26d29d86c7b33e77e5fd6ee13afb04ad2e7a31da7b48588a97b2  tools/v0.5.5-host-ux-notification.patch.gz.b64.part-00' | sha256sum -c -
          echo '2c76982d89154df2d65a365641efec51899ee23325fd1f0093d3e80cf33752c6  tools/v0.5.5-host-ux-notification.patch.gz.b64.part-01' | sha256sum -c -
          echo '15ce75b40f262603196bee817881c36c66d4d427932ac4458d2301c997a8339c  tools/v0.5.5-host-ux-notification.patch.gz.b64.part-02' | sha256sum -c -
          echo '895bdb0ac8717a0ecd3b39ac8e363581f969879f69e5297452fa7d7459d5fda2  tools/v0.5.5-host-ux-notification.patch.gz.b64.part-03' | sha256sum -c -
          echo '18169f2225921db8855ea138e5d422e30591cbff2f6c98d41ff79f81db87b3f7  tools/v0.5.5-host-ux-notification.patch.gz.b64.part-04' | sha256sum -c -
          echo 'd22eeafc2d413cd161fef07bfd5f6dff848fd505c56b8e93cde76360f4784393  tools/v0.5.5-host-ux-notification.patch.gz.b64.part-05' | sha256sum -c -
          cat tools/v0.5.5-host-ux-notification.patch.gz.b64.part-* > /tmp/v055.patch.gz.b64
          echo '23806583f53dc316f3ecd7a49d668fa0fd04871037bb253d99ee11383df1232d  /tmp/v055.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v055.patch.gz.b64 | gzip -d > /tmp/v055.patch
          echo '791044bca5b4487f9e4a6b7a094e0fb86ac2ef7aa654bc6df8c0435ff1867fdf  /tmp/v055.patch' | sha256sum -c -

      - name: Apply validated source chain
        run: |
          set -euo pipefail
          base64 -d tools/v0.5.1-guided-onboarding.patch.gz.b64 | gzip -d > /tmp/v051.patch
          for p in tools/v0.5.0-consumer-service.patch tools/v0.5.0-host-main.patch /tmp/v051.patch /tmp/v052.patch /tmp/v053.patch /tmp/v054.patch /tmp/v055.patch; do
            git apply --check "$p"
            git apply "$p"
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Host and Rental
        run: gradle --no-daemon :host:assembleDebug :consumer:assembleFieldTest

      - name: Validate v0.5.5 UX and authority boundaries
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          RENTAL_APK="$(find apps/consumer/app/build/outputs/apk/fieldTest -type f -name '*.apk' | head -n 1)"
          test "$($AAPT2 dump packagename "$HOST_APK")" = 'com.jace.phonelending.host.dev'
          test "$($AAPT2 dump packagename "$RENTAL_APK")" = 'com.jace.phonelending.consumer.field'
          $AAPT2 dump badging "$HOST_APK" | grep -q "versionCode='9' versionName='0.5.5-dev'"
          $AAPT2 dump badging "$RENTAL_APK" | grep -q "versionCode='11' versionName='0.5.5-field'"

          grep -q '0.5.5-field' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/PolicyController.java
          grep -q 'PURPOSE_DECRYPT' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerIdentity.java
          grep -q 'DIGEST_NONE' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerIdentity.java
          grep -q 'ENCRYPTION_PADDING_RSA_PKCS1' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerIdentity.java
          grep -q 'for (PairingPayload.Endpoint e : payload.endpoints)' apps/host/app/src/main/java/com/jace/phonelending/host/ConsumerClient.java
          grep -q 'NsdDiscovery.resolve(context, payload.serviceName, 1800L)' apps/host/app/src/main/java/com/jace/phonelending/host/ConsumerClient.java

          test -f apps/host/app/src/main/java/com/jace/phonelending/host/RentalRatePreset.java
          grep -q 'showDashboard' apps/host/app/src/main/java/com/jace/phonelending/host/MainActivity.java
          grep -q 'showDevices' apps/host/app/src/main/java/com/jace/phonelending/host/MainActivity.java
          grep -q 'showSettings' apps/host/app/src/main/java/com/jace/phonelending/host/MainActivity.java
          grep -q 'pagerNavigation' apps/host/app/src/main/java/com/jace/phonelending/host/MainActivity.java
          grep -q 'MotionEvent' apps/host/app/src/main/java/com/jace/phonelending/host/MainActivity.java
          grep -q 'THEME_LIGHT' apps/host/app/src/main/java/com/jace/phonelending/host/HostPrefs.java
          grep -q 'THEME_DARK' apps/host/app/src/main/java/com/jace/phonelending/host/HostPrefs.java
          grep -q 'THEME_SYSTEM' apps/host/app/src/main/java/com/jace/phonelending/host/HostPrefs.java
          test -f apps/host/app/src/main/res/values-night/colors.xml
          grep -q 'androidx.appcompat:appcompat:1.8.0' apps/host/app/build.gradle

          grep -q '00:00:00' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/MainActivity.java
          grep -q '00:00:00' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          grep -q 'setVisibility(Notification.VISIBILITY_PUBLIC)' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          grep -q 'PAIRING_SUCCESS' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          grep -q 'SESSION_STARTED' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          grep -q 'SESSION_EXPIRED' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          test -f contracts/PhoneLending_Host_UX_Rate_Presets_Notification_Addendum_v0.5.5.md
          grep -q 'automatic TTL' contracts/PhoneLending_Host_UX_Rate_Presets_Notification_Addendum_v0.5.5.md
          grep -q 'does not create per-device `.log` files' services/control-service/README.md

          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('apps/consumer/app/src/main/java/com/jace/phonelending/consumer/SessionStore.java').read_text()
          allowed={'UNPROVISIONED','AVAILABLE_LOCKED','ACTIVE','EXPIRED_LOCKED','ADMIN_MAINTENANCE','RECOVERY_LOCKED'}
          names=[n for n,v in re.findall(r'public static final String ([A-Z_]+) = "([A-Z_]+)";',s) if n==v and n in allowed]
          assert len(names)==6 and set(names)==allowed, names
          c=Path('apps/host/app/src/main/java/com/jace/phonelending/host/ConsumerClient.java').read_text()
          assert c.index('for (PairingPayload.Endpoint e : payload.endpoints)') < c.index('NsdDiscovery.resolve(context, payload.serviceName, 1800L)')
          hp=Path('apps/host/app/src/main/java/com/jace/phonelending/host/HostPrefs.java').read_text()
          for duration,price in [(60,5),(120,10),(240,20),(600,50),(1200,100)]:
              assert f'new RentalRatePreset({duration}, {price})' in hp, (duration, price)
          assert 'saveRatePreset' in hp and 'resetRatePresets' in hp
          rental=Path('apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java').read_text()
          assert 'pricePesos' not in rental and 'RentalRatePreset' not in rental
          PY
          echo 'PASS: v0.5.5 Host UX, presets, renter notification, diagnostics and authority boundaries validated.'

      - name: Verify compile artifacts unsigned
        run: |
          set -euo pipefail
          for apk in $(find apps/host/app/build/outputs/apk/debug apps/consumer/app/build/outputs/apk/fieldTest -type f -name '*.apk'); do
            if apksigner verify "$apk" >/dev/null 2>&1; then echo "unexpected signed APK: $apk"; exit 1; fi
          done

      - name: Collect artifacts
        run: |
          mkdir -p unsigned-dist source-dist/PhoneLending-Control-v0.5.5-source
          cp $(find apps/host/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1) unsigned-dist/PhoneLending-Host-v0.5.5-vc9-UNSIGNED.apk
          cp $(find apps/consumer/app/build/outputs/apk/fieldTest -type f -name '*.apk' | head -n 1) unsigned-dist/PhoneLending-Rental-v0.5.5-vc11-field-UNSIGNED.apk
          sha256sum unsigned-dist/*.apk > unsigned-dist/SHA256SUMS.txt
          rsync -a --exclude '.git/' --exclude '**/build/' --exclude '.gradle/' --exclude 'source-dist/' --exclude 'unsigned-dist/' ./ source-dist/PhoneLending-Control-v0.5.5-source/
          printf '%s\n' '${{ github.sha }}' > source-dist/PhoneLending-Control-v0.5.5-source/SOURCE_BRANCH_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.5.5-host-ux-notification-unsigned
          path: unsigned-dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.5.5-host-ux-notification-source
          path: source-dist/
          retention-days: 14
