name: PhoneLending v0.5.1 Guided Onboarding Build

on:
  push:
    branches:
      - batch2-v0.5.1-guided-onboarding
  workflow_dispatch:

jobs:
  compile_and_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply validated v0.5.0 base patches and v0.5.1 correction
        run: |
          set -euo pipefail
          base64 -d tools/v0.5.1-guided-onboarding.patch.gz.b64 | gzip -d > /tmp/v051.patch
          git apply --check tools/v0.5.0-consumer-service.patch
          git apply tools/v0.5.0-consumer-service.patch
          git apply --check tools/v0.5.0-host-main.patch
          git apply tools/v0.5.0-host-main.patch
          git apply --check /tmp/v051.patch
          git apply /tmp/v051.patch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Host and Rental field build
        run: gradle --no-daemon :host:assembleDebug :consumer:assembleFieldTest

      - name: Verify v0.5.1 onboarding and safety boundaries
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RENTAL_APK="$(find apps/consumer/app/build/outputs/apk/fieldTest -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          test "$($AAPT2 dump packagename "$HOST_APK")" = 'com.jace.phonelending.host.dev'
          test "$($AAPT2 dump packagename "$RENTAL_APK")" = 'com.jace.phonelending.consumer.field'
          $AAPT2 dump badging "$HOST_APK" | grep -q "versionCode='5' versionName='0.5.1-dev'"
          $AAPT2 dump badging "$RENTAL_APK" | grep -q "versionCode='7' versionName='0.5.1-field'"

          MANIFEST="$($AAPT2 dump xmltree "$RENTAL_APK" --file AndroidManifest.xml)"
          echo "$MANIFEST" | grep -q 'android.permission.SYSTEM_ALERT_WINDOW'
          if echo "$MANIFEST" | grep 'android:testOnly' | grep -qE '0xffffffff|true'; then
            echo 'ERROR: Rental field APK is testOnly=true'
            exit 1
          fi

          grep -q 'SETUP — STEP 1 OF 2' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/MainActivity.java
          grep -q 'SETUP — STEP 2 OF 2' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/MainActivity.java
          grep -q 'if (!paired)' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/MainActivity.java
          grep -q 'renderLockAccessRequired' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/MainActivity.java
          grep -q 'if (!pairing.isPaired()) return;' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          grep -q 'pairing.isPaired() && policy.softLockPermissionGranted()' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          grep -q 'lock_access_required' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          grep -q 'hasLockAccessProblem' apps/host/app/src/main/java/com/jace/phonelending/host/MainActivity.java
          grep -q 'NEEDS ATTENTION' apps/host/app/src/main/java/com/jace/phonelending/host/MainActivity.java
          grep -q 'MAX_LOCK_MS = 5L \* 60L \* 1000L' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/DevelopmentSoftLock.java
          grep -q 'tapCount >= 7' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/DevelopmentSoftLock.java

          rm -rf /tmp/rental-dex && mkdir -p /tmp/rental-dex
          unzip -j "$RENTAL_APK" 'classes*.dex' -d /tmp/rental-dex >/dev/null
          grep -a -q 'DevelopmentSoftLock' /tmp/rental-dex/classes*.dex || { echo 'ERROR: soft-lock implementation missing from APK'; exit 1; }
          grep -a -q 'SETUP — STEP 1 OF 2' /tmp/rental-dex/classes*.dex || { echo 'ERROR: guided setup strings missing from APK'; exit 1; }

          test -f contracts/PhoneLending_StageA_Onboarding_Amendment_v1.5.1.md
          echo 'PASS: v0.5.1 two-step verified onboarding, pairing gate, permission-loss readiness handling, seven-tap recovery, and five-minute fail-open are present.'

      - name: Verify compile APKs are unsigned
        run: |
          set -euo pipefail
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RENTAL_APK="$(find apps/consumer/app/build/outputs/apk/fieldTest -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          for apk in "$HOST_APK" "$RENTAL_APK"; do
            if apksigner verify "$apk" >/dev/null 2>&1; then
              echo "ERROR: compile artifact unexpectedly signed: $apk"
              exit 1
            fi
          done

      - name: Collect unsigned artifacts
        run: |
          set -euo pipefail
          mkdir -p unsigned-dist
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          RENTAL_APK="$(find apps/consumer/app/build/outputs/apk/fieldTest -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          cp "$HOST_APK" unsigned-dist/PhoneLending-Host-v0.5.1-vc5-UNSIGNED.apk
          cp "$RENTAL_APK" unsigned-dist/PhoneLending-Rental-v0.5.1-vc7-field-UNSIGNED.apk
          sha256sum unsigned-dist/*.apk > unsigned-dist/SHA256SUMS.txt

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.5.1-unsigned
          path: unsigned-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Package patched source snapshot
        run: |
          set -euo pipefail
          mkdir -p source-dist/PhoneLending-Control-v0.5.1-source
          rsync -a --exclude '.git/' --exclude '**/build/' --exclude '.gradle/' --exclude 'source-dist/' --exclude 'unsigned-dist/' ./ source-dist/PhoneLending-Control-v0.5.1-source/
          printf '%s\n' '${{ github.sha }}' > source-dist/PhoneLending-Control-v0.5.1-source/SOURCE_BRANCH_COMMIT.txt
          printf '%s\n' 'v0.5.0 base patches plus v0.5.1 guided-onboarding correction were applied before this snapshot was created.' > source-dist/PhoneLending-Control-v0.5.1-source/PATCH_APPLICATION_NOTE.txt
          find source-dist/PhoneLending-Control-v0.5.1-source -type f -print0 | sort -z | xargs -0 sha256sum > source-dist/SOURCE_SHA256SUMS.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.5.1-source
          path: source-dist/
          if-no-files-found: error
          retention-days: 14
