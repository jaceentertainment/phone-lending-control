name: Export Android Build Tools 36

on:
  push:
    branches: [ batch12-v0.7.0-owner-design-master ]
    paths:
      - '.github/workflows/export-build-tools-36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export_tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "build-tools;36.0.0"
      - name: Collect build tools needed for local artifact verification/signing
        run: |
          set -euo pipefail
          mkdir -p out/android-build-tools-36.0.0
          cp -a "$ANDROID_HOME/build-tools/36.0.0/." out/android-build-tools-36.0.0/
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-36.0.0
          path: out/android-build-tools-36.0.0
          retention-days: 1
