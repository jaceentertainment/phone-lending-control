name: PhoneLending v0.7.0 Visual Smoke

on:
  push:
    branches:
      - batch12-v0.7.0-owner-design-master
    paths:
      - '.github/workflows/phonelending-v070-visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.7.0 owner-design source
        run: bash tools/reconstruct-v070.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK, emulator and API 35 image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Build Host candidate
        run: gradle --no-daemon :host:assembleDebug

      - name: Sign Host with ephemeral visual-test key
        run: |
          set -euo pipefail
          HOST_UNSIGNED="$(find apps/host/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          mkdir -p out/visual
          keytool -genkeypair -noprompt \
            -keystore out/visual/visual-test.p12 -storetype PKCS12 \
            -storepass visualtest123 -keypass visualtest123 \
            -alias visual-test -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=PhoneLending Visual Smoke,O=Jace Entertainment,C=PH'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -P 4 4 "$HOST_UNSIGNED" out/visual/host-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks out/visual/visual-test.p12 --ks-type PKCS12 --ks-key-alias visual-test \
            --ks-pass pass:visualtest123 --key-pass pass:visualtest123 \
            --v4-signing-enabled false \
            --out out/visual/PhoneLending-Host-v0.7.0-visual-smoke.apk out/visual/host-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose out/visual/PhoneLending-Host-v0.7.0-visual-smoke.apk

      - name: Start emulator
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          echo no | avdmanager create avd -f -n pl_visual -k "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd pl_visual \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot -wipe-data \
            > out/visual/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 1080x2400
          adb shell wm density 420
          sleep 3

      - name: Install and capture top-level Host screens
        run: |
          set -euo pipefail
          APK=out/visual/PhoneLending-Host-v0.7.0-visual-smoke.apk
          adb install -r "$APK"
          adb shell am force-stop com.jace.phonelending.host.dev
          adb shell monkey -p com.jace.phonelending.host.dev -c android.intent.category.LAUNCHER 1 >/dev/null
          sleep 3
          adb exec-out screencap -p > out/visual/01-dashboard.png
          adb shell uiautomator dump /sdcard/dashboard.xml >/dev/null || true
          adb pull /sdcard/dashboard.xml out/visual/01-dashboard.xml >/dev/null || true

          # Bottom navigation is three equal semantic targets; use screen-relative centers.
          adb shell input tap 540 2180
          sleep 2
          adb exec-out screencap -p > out/visual/02-devices.png
          adb shell uiautomator dump /sdcard/devices.xml >/dev/null || true
          adb pull /sdcard/devices.xml out/visual/02-devices.xml >/dev/null || true

          adb shell input tap 900 2180
          sleep 2
          adb exec-out screencap -p > out/visual/03-settings.png
          adb shell uiautomator dump /sdcard/settings.xml >/dev/null || true
          adb pull /sdcard/settings.xml out/visual/03-settings.xml >/dev/null || true

          adb shell dumpsys window windows > out/visual/window-dump.txt || true
          adb shell dumpsys activity activities > out/visual/activity-dump.txt || true

      - name: Upload visual smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.7.0-visual-smoke-evidence
          path: out/visual
          retention-days: 7
