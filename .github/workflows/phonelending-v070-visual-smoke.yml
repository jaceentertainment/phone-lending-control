name: PhoneLending v0.7.0 Visual Smoke

on:
  push:
    branches:
      - batch12-v0.7.0-owner-design-master
    paths:
      - '.github/workflows/phonelending-v070-visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual_smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v0.7.0 owner-design source
        run: bash tools/reconstruct-v070.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Build Host candidate
        run: gradle --no-daemon :host:assembleDebug

      - name: Sign Host with ephemeral visual-test key
        run: |
          set -euo pipefail
          HOST_UNSIGNED="$(find apps/host/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          mkdir -p out/visual
          keytool -genkeypair -noprompt \
            -keystore out/visual/visual-test.p12 -storetype PKCS12 \
            -storepass visualtest123 -keypass visualtest123 \
            -alias visual-test -keyalg RSA -keysize 2048 -validity 2 \
            -dname 'CN=PhoneLending Visual Smoke,O=Jace Entertainment,C=PH'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -P 4 4 "$HOST_UNSIGNED" out/visual/host-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks out/visual/visual-test.p12 --ks-type PKCS12 --ks-key-alias visual-test \
            --ks-pass pass:visualtest123 --key-pass pass:visualtest123 \
            --v4-signing-enabled false \
            --out out/visual/PhoneLending-Host-v0.7.0-visual-smoke.apk out/visual/host-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose out/visual/PhoneLending-Host-v0.7.0-visual-smoke.apk

      - name: Enable KVM for emulator
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Boot emulator and capture approved two-page Host shell
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p out/visual
            adb shell wm size 1080x2400
            adb shell wm density 420
            adb install -r out/visual/PhoneLending-Host-v0.7.0-visual-smoke.apk
            adb shell am force-stop com.jace.phonelending.host.dev
            adb shell monkey -p com.jace.phonelending.host.dev -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 5
            adb exec-out screencap -p > out/visual/00-first-run-setup.png
            adb shell input tap 540 800
            adb shell input keyevent 9
            adb shell input keyevent 11
            adb shell input keyevent 13
            adb shell input keyevent 15
            adb shell input keyevent 8
            adb shell input keyevent 10
            adb shell input tap 540 965
            adb shell input keyevent 9
            adb shell input keyevent 11
            adb shell input keyevent 13
            adb shell input keyevent 15
            adb shell input keyevent 8
            adb shell input keyevent 10
            adb shell input keyevent 4
            sleep 1
            adb shell input tap 540 1125
            sleep 3
            adb exec-out screencap -p > out/visual/00-operator-unlock.png
            adb shell input tap 540 680
            adb shell input keyevent 9
            adb shell input keyevent 11
            adb shell input keyevent 13
            adb shell input keyevent 15
            adb shell input keyevent 8
            adb shell input keyevent 10
            adb shell input keyevent 4
            sleep 1
            adb shell input tap 540 850
            sleep 5
            adb exec-out screencap -p > out/visual/01-dashboard.png
            adb shell uiautomator dump /sdcard/dashboard.xml >/dev/null || true
            adb pull /sdcard/dashboard.xml out/visual/01-dashboard.xml >/dev/null || true
            adb shell input swipe 180 1200 900 1200 500
            sleep 3
            adb exec-out screencap -p > out/visual/02-settings.png
            adb shell uiautomator dump /sdcard/settings.xml >/dev/null || true
            adb pull /sdcard/settings.xml out/visual/02-settings.xml >/dev/null || true
            adb shell input swipe 900 1200 180 1200 500
            sleep 3
            adb exec-out screencap -p > out/visual/03-dashboard-return.png
            adb shell uiautomator dump /sdcard/dashboard-return.xml >/dev/null || true
            adb pull /sdcard/dashboard-return.xml out/visual/03-dashboard-return.xml >/dev/null || true
            adb shell dumpsys window windows > out/visual/window-dump.txt || true
            adb shell dumpsys activity activities > out/visual/activity-dump.txt || true

      - name: Upload visual smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.7.0-visual-smoke-evidence
          path: out/visual
          retention-days: 7
