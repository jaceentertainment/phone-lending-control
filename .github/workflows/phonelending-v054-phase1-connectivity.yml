name: PhoneLending v0.5.4 Phase-1 Connectivity Build

on:
  push:
    branches:
      - batch4-v0.5.4-phase1-connectivity
  workflow_dispatch:

jobs:
  compile_and_validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct patches
        run: |
          set -euo pipefail
          cat tools/v0.5.2-professional-ui.patch.gz.b64.part-* > /tmp/v052.patch.gz.b64
          echo '025bee9ee89255810ff313b25c6f7e64649727b73336e757b3023a03f18989ae  /tmp/v052.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v052.patch.gz.b64 | gzip -d > /tmp/v052.patch
          echo 'baa3b11b1af7e00f43540b0c1975f90e9a6f6f320984da72ec7a5022dbf5573c  /tmp/v052.patch' | sha256sum -c -
          echo '8f146648fed89d24e91d76f5ac439bd927617033e87e632a9cc167083698c306  tools/v0.5.3-timer-qualification.patch.gz.b64' | sha256sum -c -
          base64 -d tools/v0.5.3-timer-qualification.patch.gz.b64 | gzip -d > /tmp/v053.patch
          echo '12c998cf9440377b8b1b5bd01d187b04b5e7f1a87bf660791e29de2caed5276f  /tmp/v053.patch' | sha256sum -c -
          # The base64 wrapper is transport-only and may differ by terminal newline.
          # Integrity is enforced on the decoded source patch itself below.
          base64 -d tools/v0.5.4-phase1-android.patch.gz.b64 | gzip -d > /tmp/v054.patch
          echo '81f25cd8db4ee81075aa492ec88db6835170c67f3066fff1ad81e0e57a6c859d  /tmp/v054.patch' | sha256sum -c -

      - name: Apply validated source chain
        run: |
          set -euo pipefail
          base64 -d tools/v0.5.1-guided-onboarding.patch.gz.b64 | gzip -d > /tmp/v051.patch
          for p in tools/v0.5.0-consumer-service.patch tools/v0.5.0-host-main.patch /tmp/v051.patch /tmp/v052.patch /tmp/v053.patch /tmp/v054.patch; do
            git apply --check "$p"
            git apply "$p"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile Host and Rental
        run: gradle --no-daemon :host:assembleDebug :consumer:assembleFieldTest

      - name: Validate Phase-1 boundaries
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          HOST_APK="$(find apps/host/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          RENTAL_APK="$(find apps/consumer/app/build/outputs/apk/fieldTest -type f -name '*.apk' | head -n 1)"
          test "$($AAPT2 dump packagename "$HOST_APK")" = 'com.jace.phonelending.host.dev'
          test "$($AAPT2 dump packagename "$RENTAL_APK")" = 'com.jace.phonelending.consumer.field'
          $AAPT2 dump badging "$HOST_APK" | grep -q "versionCode='8' versionName='0.5.4-dev'"
          $AAPT2 dump badging "$RENTAL_APK" | grep -q "versionCode='10' versionName='0.5.4-field'"
          grep -q '0.5.4-field' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/PolicyController.java
          grep -q 'PURPOSE_DECRYPT' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerIdentity.java
          grep -q 'DIGEST_NONE' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerIdentity.java
          grep -q 'ENCRYPTION_PADDING_RSA_PKCS1' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerIdentity.java
          grep -q 'defaultServiceName' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ConsumerService.java
          grep -q 'Host cannot connect until the QR is visible' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/MainActivity.java
          grep -q 'for (PairingPayload.Endpoint e : payload.endpoints)' apps/host/app/src/main/java/com/jace/phonelending/host/ConsumerClient.java
          grep -q 'NsdDiscovery.resolve(context, payload.serviceName, 1800L)' apps/host/app/src/main/java/com/jace/phonelending/host/ConsumerClient.java
          grep -q 'phone-lending-control-jacevelarde-4121.vercel.app' apps/consumer/app/src/main/java/com/jace/phonelending/consumer/ControlServiceConfig.java
          grep -q 'PL_DIAG' services/control-service/api/report.js
          test -f contracts/PhoneLending_Phase1_Connectivity_Diagnostics_Update_Addendum_v0.5.4.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('apps/consumer/app/src/main/java/com/jace/phonelending/consumer/SessionStore.java').read_text()
          names=[n for n,v in re.findall(r'public static final String ([A-Z_]+) = "([A-Z_]+)";',s) if n==v and n in {'UNPROVISIONED','AVAILABLE_LOCKED','ACTIVE','EXPIRED_LOCKED','ADMIN_MAINTENANCE','RECOVERY_LOCKED'}]
          assert len(names)==6 and len(set(names))==6, names
          c=Path('apps/host/app/src/main/java/com/jace/phonelending/host/ConsumerClient.java').read_text()
          assert c.index('for (PairingPayload.Endpoint e : payload.endpoints)') < c.index('NsdDiscovery.resolve(context, payload.serviceName, 1800L)')
          PY
          echo 'PASS: Phase-1 QR/TLS/diagnostics/update-check boundaries validated.'

      - name: Verify compile artifacts unsigned
        run: |
          set -euo pipefail
          for apk in $(find apps/host/app/build/outputs/apk/debug apps/consumer/app/build/outputs/apk/fieldTest -type f -name '*.apk'); do
            if apksigner verify "$apk" >/dev/null 2>&1; then echo "unexpected signed APK: $apk"; exit 1; fi
          done

      - name: Collect artifacts
        run: |
          mkdir -p unsigned-dist source-dist/PhoneLending-Control-v0.5.4-source
          cp $(find apps/host/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1) unsigned-dist/PhoneLending-Host-v0.5.4-vc8-UNSIGNED.apk
          cp $(find apps/consumer/app/build/outputs/apk/fieldTest -type f -name '*.apk' | head -n 1) unsigned-dist/PhoneLending-Rental-v0.5.4-vc10-field-UNSIGNED.apk
          sha256sum unsigned-dist/*.apk > unsigned-dist/SHA256SUMS.txt
          rsync -a --exclude '.git/' --exclude '**/build/' --exclude '.gradle/' --exclude 'source-dist/' --exclude 'unsigned-dist/' ./ source-dist/PhoneLending-Control-v0.5.4-source/
          printf '%s\n' '${{ github.sha }}' > source-dist/PhoneLending-Control-v0.5.4-source/SOURCE_BRANCH_COMMIT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.5.4-phase1-unsigned
          path: unsigned-dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: phonelending-v0.5.4-phase1-source
          path: source-dist/
          retention-days: 14
