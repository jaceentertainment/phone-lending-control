plugins {
    id 'com.android.application'
}

def devStorePath = System.getenv('PL_CONSUMER_DEV_KEYSTORE_PATH') ?: project.findProperty('plConsumerDevKeystorePath')
def devStorePassword = System.getenv('PL_CONSUMER_DEV_STORE_PASSWORD') ?: project.findProperty('plConsumerDevStorePassword')
def devKeyAlias = System.getenv('PL_CONSUMER_DEV_KEY_ALIAS') ?: project.findProperty('plConsumerDevKeyAlias')
def devKeyPassword = System.getenv('PL_CONSUMER_DEV_KEY_PASSWORD') ?: project.findProperty('plConsumerDevKeyPassword')
def stableDevSigningConfigured = [devStorePath, devStorePassword, devKeyAlias, devKeyPassword].every { it != null && !it.toString().trim().isEmpty() }

android {
    namespace 'com.jace.phonelending.consumer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jace.phonelending.consumer'
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName '0.4.1'
    }

    signingConfigs {
        if (stableDevSigningConfigured) {
            consumerDev {
                storeFile file(devStorePath)
                storePassword devStorePassword
                keyAlias devKeyAlias
                keyPassword devKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            debuggable true
            manifestPlaceholders = [testOnlyFlag:'true']
            if (stableDevSigningConfigured) signingConfig signingConfigs.consumerDev
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [testOnlyFlag:'false']
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('verifyStableDevSigningConfigured') {
    doLast {
        if (!stableDevSigningConfigured) {
            throw new GradleException('Stable Consumer development signing is not configured. Compile-only builds may use the runner debug key, but distributable APKs must provide PL_CONSUMER_DEV_* signing inputs.')
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
}
