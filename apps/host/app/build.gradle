plugins {
    id 'com.android.application'
}

def devStorePath = System.getenv('PL_HOST_DEV_KEYSTORE_PATH') ?: project.findProperty('plHostDevKeystorePath')
def devStorePassword = System.getenv('PL_HOST_DEV_STORE_PASSWORD') ?: project.findProperty('plHostDevStorePassword')
def devKeyAlias = System.getenv('PL_HOST_DEV_KEY_ALIAS') ?: project.findProperty('plHostDevKeyAlias')
def devKeyPassword = System.getenv('PL_HOST_DEV_KEY_PASSWORD') ?: project.findProperty('plHostDevKeyPassword')
def stableDevSigningConfigured = [devStorePath, devStorePassword, devKeyAlias, devKeyPassword].every { it != null && !it.toString().trim().isEmpty() }

android {
    namespace 'com.jace.phonelending.host'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jace.phonelending.host'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '0.5.0'
    }

    signingConfigs {
        if (stableDevSigningConfigured) {
            hostDev {
                storeFile file(devStorePath)
                storePassword devStorePassword
                keyAlias devKeyAlias
                keyPassword devKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            debuggable true
            // Never fall back to Gradle's machine-local debug keystore. Without the
            // externally supplied pinned signer this build is deliberately unsigned.
            signingConfig stableDevSigningConfigured ? signingConfigs.hostDev : null
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('verifyStableDevSigningConfigured') {
    doLast {
        if (!stableDevSigningConfigured) {
            throw new GradleException('Stable Host development signing is not configured. Unsigned compile artifacts are allowed, but distributable APKs must provide PL_HOST_DEV_* signing inputs.')
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
